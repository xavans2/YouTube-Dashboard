name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish ${{ matrix.target }} ${{ matrix.arch }}
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload ${{ matrix.target }} ${{ matrix.arch }} build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish one GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' release_files < <(find release-assets -type f ! -name 'builder-debug.yml' -print0)
          gh release create "${GITHUB_REF_NAME}" "${release_files[@]}" \
            --title "Xavis Analytics ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
