name: Build and publish desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-latest
            target: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish ${{ matrix.target }} ${{ matrix.arch }}
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }} --publish never

      - name: Upload ${{ matrix.target }} ${{ matrix.arch }} build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          # Keep each platform in its own directory. Some electron-builder
          # metadata files share a name across platforms and cannot be merged
          # into one directory by download-artifact.
          merge-multiple: false

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "Xavis Analytics ${GITHUB_REF_NAME}" \
              --generate-notes \
              --latest
          fi

      - name: Upload all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r -d '' asset; do
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
          done < <(find release-assets -type f ! -name 'builder-debug.yml' -print0)
